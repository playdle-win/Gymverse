<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>GymBros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,700;1,800&family=Barlow:wght@400;500;600;700&family=Jersey+15&family=Nunito:wght@700;800&display=swap">
<style>
/* 00-tokens.css */
/* GymBros design tokens. Screens style ONLY through these (docs/SPEC.md section 6).
   Three axes, each an attribute on <html> (any element may also carry one to scope a subtree, the kit does):
     data-style   = studio | arcade | varsity      type, shape, edges, elevation, motion
     data-gbtheme = ember | cobalt | pine | berry | graphite      one accent family, light + dark
     data-theme   = light | dark                   only when the user (or the host) forces an appearance
   Colours were generated in OKLCH and every text / control pair below was checked against WCAG
   (4.5:1 text, 3:1 large text and control edges). The table is in src/ui/system/README.md. */

:root {
  color-scheme: light dark;

  /* constant meaning on every theme: the points coin */
  --points: #F4B41A;
  --points-edge: #965E00;
  --points-ink: #4A2E00;

  /* layout */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tap: 44px;
  --navbar-h: 48px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;

  /* type scale shared by every style (size/line-height). Display sizes are set per style below. */
  --t-headline: 17px/22px;
  --t-body: 17px/22px;
  --t-callout: 16px/21px;
  --t-foot: 13px/18px;
  --t-caption: 12px/16px;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

/* derived tokens, re-resolved wherever a style or theme scope starts */
:root, [data-gbtheme], [data-style] {
  --focus: var(--accent-text);
  --tabbar-space: calc(var(--tabbar-h) + var(--tabbar-bottom));
  --chart-grid: var(--line);
  --chart-axis: var(--ink-3);
  --chart-line: var(--accent);
  --chart-area: var(--accent-soft);
  --chart-muted: var(--ink-3);
}

/* ------------------------------------------------------------------ studio
   Apple-native. System type, rounded numerals, hairlines, soft layered depth, glass on the floating layer only. */
:root, [data-style="studio"] {
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
  --font-label: var(--font-ui);
  --display-weight: 700; --display-style: normal; --display-case: none; --display-track: -0.022em;
  --num-weight: 700; --num-style: normal; --num-track: -0.01em; --num-scale: 1;
  --label-weight: 600; --label-case: none; --label-track: 0;
  --t-large: 34px/41px;
  --t-title: 22px/28px;
  --t-label: 11px/13px;
  --t-navtitle: 17px/22px; --navtitle-weight: 600;
  --t-section: 20px/25px;
  --t-sublabel: 13px/18px;

  --r-s: 10px; --r-m: 14px; --r-l: 24px; --r-pill: 999px;
  --r-control: 14px;
  --r-avatar: 50%; --r-fab: 999px;
  --bw: 1px;
  --edge: var(--line);
  --edge-control: transparent;
  --shadow-1: 0 1px 2px rgb(var(--shadow-rgb) / calc(0.05 * var(--shadow-k))), 0 6px 16px -6px rgb(var(--shadow-rgb) / calc(0.12 * var(--shadow-k)));
  --shadow-2: 0 2px 6px rgb(var(--shadow-rgb) / calc(0.06 * var(--shadow-k))), 0 22px 48px -12px rgb(var(--shadow-rgb) / calc(0.26 * var(--shadow-k)));
  --ease: cubic-bezier(0.22, 0.9, 0.28, 1);
  --dur-1: 160ms; --dur-2: 380ms;
  --ease-move: cubic-bezier(0.22, 0.9, 0.28, 1);
  --press: scale(0.97);
  --seg-thumb: var(--bg-elevated); --seg-ink: var(--ink);

  --gutter: 20px;
  --tabbar-h: 62px;
  --tabbar-bottom: max(calc(var(--safe-b) - 10px), 10px);
}

/* ------------------------------------------------------------------ arcade
   Habbo-era pixel. Jersey 15 on its native 15px grid for titles, numbers and labels; 2px ink edges, 2 to 4px radii,
   hard offset shadows, stepped motion. Body copy stays in the system sans. */
[data-style="arcade"] {
  --font-display: "Jersey 15", "Jersey 10", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-num: var(--font-display);
  --font-label: var(--font-display);
  --display-weight: 400; --display-style: normal; --display-case: none; --display-track: 0.01em;
  --num-weight: 400; --num-style: normal; --num-track: 0.02em; --num-scale: 1.32;
  --label-weight: 400; --label-case: none; --label-track: 0;
  --t-large: 45px/45px;
  --t-title: 30px/30px;
  --t-label: 15px/15px;
  --t-navtitle: 23px/24px; --navtitle-weight: 400;
  --t-section: 23px/24px;
  --t-sublabel: 15px/18px;

  --r-s: 2px; --r-m: 3px; --r-l: 4px; --r-pill: 4px;
  --r-control: 3px;
  --r-avatar: 3px; --r-fab: 4px;
  --bw: 2px;
  --edge: var(--ink);
  --edge-control: var(--ink);
  --shadow-1: 3px 3px 0 rgb(var(--shadow-rgb) / calc(0.26 * var(--shadow-k)));
  --shadow-2: 5px 5px 0 rgb(var(--shadow-rgb) / calc(0.3 * var(--shadow-k)));
  --ease: steps(4, end);
  --dur-1: 120ms; --dur-2: 240ms;
  --ease-move: steps(5, end);
  --press: translateY(2px);
  --seg-thumb: var(--accent); --seg-ink: var(--accent-ink);
  --focus: var(--ink);

  --gutter: 16px;
  --tabbar-h: 62px;
  --tabbar-bottom: var(--safe-b);
}

/* ------------------------------------------------------------------ varsity
   Bold sport. Barlow Condensed heavy italic capitals for titles and numbers, Barlow for reading, pill controls,
   inverse blocks, one slanted detail (the active tab and badges). */
[data-style="varsity"] {
  --font-ui: "Barlow", -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Barlow Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", var(--font-ui);
  --font-num: var(--font-display);
  --font-label: var(--font-display);
  --display-weight: 800; --display-style: italic; --display-case: uppercase; --display-track: 0.004em;
  --num-weight: 700; --num-style: italic; --num-track: 0.01em; --num-scale: 1.16;
  --label-weight: 600; --label-case: uppercase; --label-track: 0.07em;
  --t-large: 46px/42px;
  --t-title: 28px/28px;
  --t-label: 12px/13px;
  --t-navtitle: 22px/24px; --navtitle-weight: 800;
  --t-section: 24px/24px;
  --t-sublabel: 13px/18px;

  --r-s: 10px; --r-m: 16px; --r-l: 26px; --r-pill: 999px;
  --r-control: 999px;
  --r-avatar: 50%; --r-fab: 999px;
  --bw: 2px;
  --edge: transparent;
  --edge-control: var(--ink);
  --shadow-1: 0 1px 0 rgb(var(--shadow-rgb) / calc(0.1 * var(--shadow-k))), 0 10px 20px -12px rgb(var(--shadow-rgb) / calc(0.34 * var(--shadow-k)));
  --shadow-2: 0 2px 0 rgb(var(--shadow-rgb) / calc(0.12 * var(--shadow-k))), 0 26px 44px -18px rgb(var(--shadow-rgb) / calc(0.46 * var(--shadow-k)));
  --ease: cubic-bezier(0.3, 1.36, 0.5, 1);
  --dur-1: 150ms; --dur-2: 320ms;
  --ease-move: cubic-bezier(0.2, 0.9, 0.2, 1);
  --press: scale(0.95);
  --seg-thumb: var(--ink); --seg-ink: var(--bg);

  --gutter: 20px;
  --tabbar-h: 64px;
  --tabbar-bottom: var(--safe-b);
}

/* 05-base.css */
/* Base: makes a web page behave like an installed phone app. */
*, *::before, *::after { box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
body {
  height: 100%;
  margin: 0;
  overflow: hidden; overflow: clip;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--t-body) var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
#app { height: 100%; }

/* a scoped style/theme subtree starts from its own ink and reading face */
[data-style], [data-gbtheme] { color: var(--ink); font-family: var(--font-ui); }

h1, h2, h3, h4, p, figure, dl, dd { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
img, svg, canvas, video { display: block; max-width: 100%; }
a { color: var(--accent-text); text-decoration: none; }

button {
  appearance: none;
  margin: 0; padding: 0; border: 0;
  background: none;
  color: inherit; font: inherit; text-align: inherit;
  cursor: pointer;
}
button, a, label, summary, [role="button"], [role="tab"], [role="switch"], [role="radio"] { touch-action: manipulation; }
/* controls are not content: no selection, no long-press callout */
button, label, summary, [role="button"], [role="tab"], [role="switch"], [role="radio"], .gb-nosel {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}

/* 16px minimum so iOS never zooms the page on focus */
input, textarea, select {
  margin: 0;
  font: inherit; font-size: max(16px, 1em);
  color: inherit;
  border-radius: 0;
}
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }

:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

[hidden] { display: none !important; }

/* momentum scroll areas that never chain to the page behind */
.gb-scroll {
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.gb-scroll::-webkit-scrollbar, .gb-hscroll::-webkit-scrollbar { display: none; }
.gb-hscroll {
  display: flex;
  overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}

.gb-sr {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
    scroll-behavior: auto !important;
  }
}

/* 10-type.css */
/* Type. Display faces are for titles, numbers and short labels only; everything people read stays in --font-ui. */
.t-large, .t-title {
  font-family: var(--font-display);
  font-weight: var(--display-weight);
  font-style: var(--display-style);
  letter-spacing: var(--display-track);
  text-transform: var(--display-case);
  text-wrap: balance;
}
.t-large { font: var(--display-style) var(--display-weight) var(--t-large) var(--font-display); }
.t-title { font: var(--display-style) var(--display-weight) var(--t-title) var(--font-display); }
.t-headline { font: 600 var(--t-headline) var(--font-ui); letter-spacing: -0.01em; }
.t-body { font: 400 var(--t-body) var(--font-ui); }
.t-callout { font: 400 var(--t-callout) var(--font-ui); }
.t-foot { font: 400 var(--t-foot) var(--font-ui); }
.t-caption { font: 500 var(--t-caption) var(--font-ui); }
.t-label {
  font: var(--label-weight) var(--t-label) var(--font-label);
  letter-spacing: var(--label-track);
  text-transform: var(--label-case);
}
/* chart axis text: the Progress agent uses this (or the --chart-* tokens) for ticks and legends */
.t-axis { font: 500 11px/14px var(--font-ui); color: var(--chart-axis); font-variant-numeric: tabular-nums; }

/* numbers: always tabular, always the number face */
.t-num {
  font-family: var(--font-num);
  font-weight: var(--num-weight);
  font-style: var(--num-style);
  letter-spacing: var(--num-track);
  font-variant-numeric: tabular-nums;
  font-size: calc(1em * var(--num-scale));
  line-height: 1;
}
.t-num-m { font-size: calc(22px * var(--num-scale)); }
.t-num-l { font-size: calc(32px * var(--num-scale)); }
.t-num-xl { font-size: calc(48px * var(--num-scale)); }
/* arcade: Jersey 15 stays on multiples of its 15px grid so the pixels stay square */
[data-style="arcade"] .t-num-m { font-size: 30px; }
[data-style="arcade"] .t-num-l { font-size: 45px; }
[data-style="arcade"] .t-num-xl { font-size: 60px; }
/* the italic display faces need room for descenders and the slant */
[data-style="varsity"] .t-large, [data-style="varsity"] .t-title { padding-right: 0.08em; }

.t-strong { font-weight: 600; }
.c-ink { color: var(--ink); }
.c-2 { color: var(--ink-2); }
.c-3 { color: var(--ink-3); }
.c-accent { color: var(--accent-text); }
.c-good { color: var(--good); }
.c-warn { color: var(--warn); }
.c-bad { color: var(--bad); }
.c-points { color: var(--points-text); }
.t-center { text-align: center; }
.t-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 12-shell.css */
/* Shell: frame, phone stage, tab panes, navigation stack, Screen, NavBar, TabBar.
   Layers inside the stage: panes 0, tab bar 20, cover 30, overlays 40, home indicator 60. */
.gb-frame { height: 100%; display: flex; background: var(--bg); }
.gb-device { flex: 1; min-width: 0; height: 100%; }
.gb-bezel { width: 100%; height: 100%; }
.gb-stage {
  position: relative; width: 100%; height: 100%;
  /* clip, not hidden: a focus call must never be able to scroll the stage */
  overflow: hidden; overflow: clip; isolation: isolate;
  background: var(--bg);
}

/* wide windows: a centred phone with the prototype controls beside it */
:root.gb-framed { --safe-t: 12px; --safe-b: 30px; }
.gb-frame--desk {
  align-items: center; justify-content: center;
  gap: clamp(24px, 5vw, 76px);
  padding: 0 clamp(16px, 3vw, 40px);
  background: var(--bg-sunken);
}
.gb-frame--desk .gb-device { flex: none; height: auto; }
.gb-frame--desk .gb-bezel {
  transform-origin: 0 0;
  padding: 11px;
  border-radius: 62px;
  background: #18181B;
  box-shadow:
    inset 0 0 0 1.5px rgb(255 255 255 / 0.14),
    0 0 0 1px rgb(0 0 0 / 0.55),
    0 2px 4px rgb(var(--shadow-rgb) / 0.2),
    0 44px 70px -34px rgb(var(--shadow-rgb) / calc(0.5 * var(--shadow-k)));
}
.gb-frame--desk .gb-stage { border-radius: 51px; }
.gb-homebar {
  position: absolute; left: 50%; bottom: 8px; z-index: 60;
  width: 136px; height: 5px; margin-left: -68px;
  border-radius: 3px;
  background: var(--ink); opacity: 0.88;
  pointer-events: none;
}

[data-style="varsity"] .gb-homebar { background: var(--ink-inverse); }

/* ---- tab panes and the push/pop stack ---- */
.gb-panes { position: absolute; inset: 0; }
.gb-tabpane { position: absolute; inset: 0; --bottom-inset: var(--tabbar-space); }
.gb-tabpane[data-active="false"] { visibility: hidden; pointer-events: none; }
.gb-page { position: absolute; inset: 0; background: var(--bg); }
.gb-page[data-phase="under"] { visibility: hidden; }
.gb-page[data-phase="entering"] { animation: gb-push-in var(--dur-2) var(--ease-move) both; box-shadow: -1px 0 0 var(--line), -24px 0 48px -24px rgb(var(--shadow-rgb) / 0.28); }
.gb-page[data-phase="covering"] { animation: gb-push-under var(--dur-2) var(--ease-move) both; }
.gb-page[data-phase="revealing"] { animation: gb-pop-under var(--dur-2) var(--ease-move) both; }
.gb-page[data-phase="leaving"] { z-index: 2; animation: gb-pop-out var(--dur-2) var(--ease-move) both; box-shadow: -1px 0 0 var(--line), -24px 0 48px -24px rgb(var(--shadow-rgb) / 0.28); }
@keyframes gb-push-in { from { transform: translateX(100%); } to { transform: none; } }
@keyframes gb-push-under { from { transform: none; } to { transform: translateX(-26%); } }
@keyframes gb-pop-under { from { transform: translateX(-26%); } to { transform: none; } }
@keyframes gb-pop-out { from { transform: none; } to { transform: translateX(100%); } }

.gb-cover {
  position: absolute; inset: 0; z-index: 30;
  background: var(--bg);
  --bottom-inset: var(--safe-b);
  animation: gb-cover-in var(--dur-2) var(--ease-move) both;
}
.gb-cover[data-leaving="true"] { animation: gb-cover-out var(--dur-2) var(--ease-move) both; }
@keyframes gb-cover-in { from { transform: translateY(100%); } to { transform: none; } }
@keyframes gb-cover-out { from { transform: none; } to { transform: translateY(100%); } }

/* ---- Screen ---- */
.gb-screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); --top-inset: calc(var(--safe-t) + var(--navbar-h)); }
.gb-screen__body {
  flex: 1; min-height: 0;
  padding-top: var(--top-inset);
  padding-bottom: calc(var(--bottom-inset, 0px) + 32px);
}
.gb-screen__body--fixed { position: relative; padding: 0; overflow: hidden; overflow: clip; }
.gb-screen__sentinel { height: 1px; margin-bottom: -1px; }
.gb-screen__large { padding: 2px var(--gutter) 14px; color: var(--ink); }
.gb-screen__content { display: flex; flex-direction: column; gap: var(--s-8); padding-top: 12px; }
.gb-screen__large + .gb-screen__content { padding-top: 4px; }
.gb-screen__content--padded { padding-inline: var(--gutter); }
.gb-screen__footer {
  position: absolute; left: 0; right: 0; bottom: var(--bottom-inset, 0px); z-index: 4;
  padding: 14px var(--gutter) 16px;
  /* Solid behind the buttons, fading only across the top padding, so scrolled content never shows through a tinted button. */
  background: linear-gradient(to top, var(--bg) calc(100% - 14px), transparent);
}
.gb-screen--footer .gb-screen__body { padding-bottom: calc(var(--bottom-inset, 0px) + 112px); }

/* ---- NavBar ---- */
.gb-nav {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr); align-items: center; gap: 8px;
  height: calc(var(--safe-t) + var(--navbar-h));
  padding: var(--safe-t) var(--gutter) 0 calc(var(--gutter) - 4px);
}
.gb-nav::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
  border-bottom: 1px solid var(--line);
  opacity: 0; transition: opacity var(--dur-1) ease;
}
.gb-nav.is-solid::before { opacity: 1; }
.gb-nav__side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.gb-nav__side--trailing { justify-content: flex-end; }
.gb-nav__title {
  min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center;
  font: var(--display-style) var(--navtitle-weight) var(--t-navtitle) var(--font-display);
  letter-spacing: var(--display-track); text-transform: var(--display-case);
  opacity: 0; transform: translateY(5px);
  transition: opacity var(--dur-1) ease, transform var(--dur-1) var(--ease-move);
}
.gb-nav.has-title .gb-nav__title { opacity: 1; transform: none; }
[data-style="studio"] .gb-nav__title { letter-spacing: -0.01em; }
[data-style="arcade"] .gb-nav::before, [data-style="varsity"] .gb-nav::before {
  background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none;
}
[data-style="arcade"] .gb-nav::before { border-bottom: 2px solid var(--ink); }
[data-style="varsity"] .gb-nav::before { border-bottom: 0; box-shadow: 0 10px 14px -12px rgb(var(--shadow-rgb) / calc(0.5 * var(--shadow-k))); }
@media (prefers-reduced-transparency: reduce) {
  .gb-nav::before { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

.gb-profilebtn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; margin-right: -6px; border-radius: var(--r-avatar); transition: transform var(--dur-1) var(--ease); }
.gb-profilebtn:active { transform: var(--press); }

/* ---- TabBar ---- */
.gb-tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
  pointer-events: none;
  transition: transform var(--dur-2) var(--ease-move);
}
.gb-tabbar.is-hidden { transform: translateY(calc(100% + 30px)); }
.gb-tabbar__bar {
  position: relative;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  height: var(--tabbar-h);
  pointer-events: auto;
}
.gb-tab {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-width: 44px; min-height: 44px;
  color: var(--ink-2);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: transform var(--dur-1) var(--ease);
}
.gb-tab:active { transform: var(--press); }
.gb-tab__icon { position: relative; display: grid; place-items: center; width: 52px; height: 28px; }
.gb-tab__icon > svg { position: relative; }
.gb-tab__label {
  position: relative;
  font: var(--label-weight) var(--t-label) var(--font-label);
  letter-spacing: var(--label-track); text-transform: var(--label-case);
  white-space: nowrap;
}

/* studio: a floating translucent capsule. A web approximation of Liquid Glass (backdrop blur, a lit edge),
   used on this floating layer only, with a solid fallback when transparency is reduced. */
[data-style="studio"] .gb-tabbar { padding: 0 14px var(--tabbar-bottom); }
[data-style="studio"] .gb-tabbar::before {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: calc(100% + 14px); z-index: -1;
  background: linear-gradient(to top, var(--bg) 30%, transparent);
  pointer-events: none;
}
[data-style="studio"] .gb-tabbar__bar {
  padding: 4px;
  border-radius: 999px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 var(--glass-edge), 0 0 0 0.5px var(--line), var(--shadow-2);
}
[data-style="studio"] .gb-tab { border-radius: 999px; }
[data-style="studio"] .gb-tab::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: var(--fill); opacity: 0; transform: scale(0.86);
  transition: opacity var(--dur-1) ease, transform var(--dur-2) var(--ease);
}
[data-style="studio"] .gb-tab[aria-current] { color: var(--accent-text); }
[data-style="studio"] .gb-tab[aria-current]::before { opacity: 1; transform: none; }
@media (prefers-reduced-transparency: reduce) {
  [data-style="studio"] .gb-tabbar__bar { background: var(--bg-raised); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* arcade: a docked panel with an ink edge; the active tab is a pressed-in accent block */
[data-style="arcade"] .gb-tabbar__bar {
  height: calc(var(--tabbar-h) + var(--safe-b));
  gap: 2px; padding: 5px 8px calc(5px + var(--safe-b));
  background: var(--bg-raised);
  border-top: 2px solid var(--ink);
}
[data-style="arcade"] .gb-tab { gap: 1px; border: 2px solid transparent; border-radius: var(--r-m); color: var(--ink-2); }
[data-style="arcade"] .gb-tab__icon { height: 26px; }
[data-style="arcade"] .gb-tab[aria-current] {
  background: var(--accent); color: var(--accent-ink);
  border-color: var(--ink);
  box-shadow: inset 0 3px 0 rgb(0 0 0 / 0.2);
}

/* varsity: an inverse block; the active tab sits on one slanted accent plate */
[data-style="varsity"] .gb-tabbar__bar {
  height: calc(var(--tabbar-h) + var(--safe-b));
  padding: 0 6px var(--safe-b);
  background: var(--bg-inverse);
}
[data-style="varsity"] .gb-tab { gap: 4px; color: var(--ink-inverse-2); }
[data-style="varsity"] .gb-tab__icon::before {
  content: ""; position: absolute; inset: -1px 2px; border-radius: 7px;
  background: var(--accent-inverse);
  transform: skewX(-14deg) scaleX(0.4); opacity: 0;
  transition: transform var(--dur-2) var(--ease), opacity var(--dur-1) ease;
}
[data-style="varsity"] .gb-tab[aria-current] { color: var(--ink-inverse); }
[data-style="varsity"] .gb-tab[aria-current] .gb-tab__icon { color: var(--accent-inverse-ink); }
[data-style="varsity"] .gb-tab[aria-current] .gb-tab__icon::before { transform: skewX(-14deg); opacity: 1; }

/* 20-controls.css */
/* Controls. Shared structure; each art direction changes shape, edge and press feel through tokens,
   with a few explicit rules where a token cannot say it (the arcade lip, the varsity outline). */

.gb-icon { flex: none; }

/* ---- Spinner ---- */
.gb-spinner {
  display: inline-block; flex: none;
  border-radius: 50%;
  border: 2.5px solid currentColor; border-right-color: transparent;
  animation: gb-spin 720ms linear infinite;
}
[data-style="arcade"] .gb-spinner { animation-timing-function: steps(8, end); }
@keyframes gb-spin { to { transform: rotate(360deg); } }

/* ---- Button ---- */
.gb-btn {
  position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px;
  border: var(--bw) solid transparent; border-radius: var(--r-control);
  font: 600 17px/22px var(--font-ui); letter-spacing: -0.01em; white-space: nowrap;
  transition: transform var(--dur-1) var(--ease), filter var(--dur-1) ease, background-color var(--dur-1) ease, opacity var(--dur-1) ease;
}
.gb-btn--block { display: flex; width: 100%; }
.gb-btn--m { min-height: 44px; padding: 0 18px; font-size: 16px; }
.gb-btn--s { min-height: 34px; padding: 0 14px; font-size: 15px; line-height: 20px; gap: 6px; }
.gb-btn--s::after { content: ""; position: absolute; inset: -6px -2px; }
.gb-btn--primary { background: var(--accent); color: var(--accent-ink); }
.gb-btn--secondary { background: var(--accent-soft); color: var(--accent-text); }
.gb-btn--quiet { background: var(--fill); color: var(--ink); }
.gb-btn--plain { background: transparent; color: var(--accent-text); padding-inline: 10px; }
.gb-btn--destructive { background: var(--bad); color: var(--on-semantic); }
.gb-btn:active:not(:disabled) { transform: var(--press); filter: brightness(0.93); }
.gb-btn--plain:active:not(:disabled) { background: var(--fill); filter: none; }
.gb-btn:disabled { opacity: 0.4; cursor: default; }
.gb-btn[aria-busy="true"] { opacity: 0.78; cursor: progress; }
@media (hover: hover) and (pointer: fine) {
  .gb-btn:hover:not(:disabled) { filter: brightness(1.07); }
  .gb-btn--plain:hover:not(:disabled), .gb-btn--quiet:hover:not(:disabled) { background: var(--fill-strong); filter: none; }
}

/* arcade: ink outline, a lit top edge and a dark bottom lip that flattens when pressed */
[data-style="arcade"] .gb-btn {
  border-color: var(--ink); font-weight: 700; letter-spacing: 0;
  padding-bottom: 3px;
  box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.2), inset 0 2px 0 rgb(255 255 255 / 0.3);
}
[data-style="arcade"] .gb-btn--quiet { background: var(--bg-raised); }
[data-style="arcade"] .gb-btn--secondary { background: var(--bg-raised); color: var(--accent-text); }
[data-style="arcade"] .gb-btn--quiet, [data-style="arcade"] .gb-btn--secondary { box-shadow: inset 0 -4px 0 var(--fill-strong); }
[data-style="arcade"] .gb-btn:active:not(:disabled) { padding-bottom: 0; box-shadow: inset 0 3px 0 rgb(0 0 0 / 0.22); filter: none; }
[data-style="arcade"] .gb-btn--plain { border-color: transparent; box-shadow: none; padding-bottom: 0; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
[data-style="arcade"] .gb-btn--plain:active:not(:disabled) { box-shadow: none; }

/* varsity: pills; the neutral button is an ink outline */
[data-style="varsity"] .gb-btn { font-weight: 700; letter-spacing: 0.005em; }
[data-style="varsity"] .gb-btn--quiet { background: transparent; border-color: var(--ink); }
[data-style="varsity"] .gb-btn--quiet:active:not(:disabled) { background: var(--fill); }

/* ---- IconButton ---- */
.gb-iconbtn {
  position: relative; flex: none;
  display: inline-grid; place-items: center;
  width: 44px; height: 44px;
  border-radius: var(--r-pill);
  color: var(--ink);
  transition: transform var(--dur-1) var(--ease);
}
.gb-iconbtn::before {
  content: ""; position: absolute; inset: 0;
  border-radius: inherit; border: var(--bw) solid transparent;
  transition: background-color var(--dur-1) ease;
}
.gb-iconbtn--s::before { inset: 4px; }
.gb-iconbtn > svg { position: relative; }
.gb-iconbtn--quiet::before { background: var(--fill); border-color: var(--edge-control); }
.gb-iconbtn--tinted { color: var(--accent-text); }
.gb-iconbtn--tinted::before { background: var(--accent-soft); border-color: var(--edge-control); }
.gb-iconbtn--primary { color: var(--accent-ink); }
.gb-iconbtn--primary::before { background: var(--accent); border-color: var(--edge-control); }
.gb-iconbtn:active:not(:disabled) { transform: var(--press); }
.gb-iconbtn--plain:active:not(:disabled)::before, .gb-iconbtn--quiet:active:not(:disabled)::before { background: var(--fill-strong); }
.gb-iconbtn:disabled { opacity: 0.4; cursor: default; }
[data-style="arcade"] .gb-iconbtn--quiet::before { background: var(--bg-raised); }
[data-style="varsity"] .gb-iconbtn::before { border-color: transparent; }
@media (hover: hover) and (pointer: fine) {
  .gb-iconbtn--plain:hover:not(:disabled)::before { background: var(--fill); }
}

/* ---- Segmented ---- */
.gb-seg {
  position: relative;
  display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr));
  padding: 3px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-control);
  background: var(--fill);
}
.gb-seg__thumb {
  position: absolute; top: 3px; bottom: 3px; left: 3px;
  width: calc((100% - 6px) / var(--n));
  border-radius: calc(var(--r-control) - 3px);
  background: var(--seg-thumb);
  box-shadow: var(--shadow-1);
  transform: translateX(calc(var(--i) * 100%));
  transition: transform var(--dur-2) var(--ease);
}
.gb-seg__opt {
  position: relative; z-index: 1;
  min-height: 38px; padding: 0 8px;
  border-radius: calc(var(--r-control) - 3px);
  font: 600 15px/20px var(--font-ui); text-align: center; white-space: nowrap;
  color: var(--ink-2);
  transition: color var(--dur-1) ease;
}
.gb-seg__opt::after { content: ""; position: absolute; inset: -3px 0; }
.gb-seg__opt[aria-checked="true"] { color: var(--seg-ink); }
.gb-seg__opt:active { opacity: 0.7; }
[data-style="arcade"] .gb-seg { background: var(--bg-raised); padding: 2px; }
[data-style="arcade"] .gb-seg__thumb { top: 2px; bottom: 2px; left: 2px; width: calc((100% - 4px) / var(--n)); border-radius: 1px; box-shadow: inset 0 3px 0 rgb(0 0 0 / 0.18); }
[data-style="arcade"] .gb-seg__opt { font-weight: 700; }
[data-style="varsity"] .gb-seg { background: transparent; }
[data-style="varsity"] .gb-seg__thumb { border-radius: 999px; box-shadow: none; }
[data-style="varsity"] .gb-seg__opt { font-weight: 700; }

/* ---- Chips ---- */
.gb-chips { gap: 8px; padding-block: 4px; }
.gb-chips--bleed { margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); }
.gb-chip {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 14px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-pill);
  background: var(--fill); color: var(--ink);
  font: 500 15px/20px var(--font-ui); white-space: nowrap;
  transition: transform var(--dur-1) var(--ease), background-color var(--dur-1) ease, color var(--dur-1) ease;
}
.gb-chip::after { content: ""; position: absolute; inset: -5px -2px; }
.gb-chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.gb-chip:active:not(:disabled) { transform: var(--press); }
.gb-chip:disabled { opacity: 0.4; }
[data-style="arcade"] .gb-chip { background: var(--bg-raised); font-weight: 600; box-shadow: inset 0 -3px 0 var(--fill-strong); }
[data-style="arcade"] .gb-chip[aria-pressed="true"] { background: var(--accent); box-shadow: inset 0 3px 0 rgb(0 0 0 / 0.2); }
[data-style="varsity"] .gb-chip { border-color: transparent; font-weight: 600; }

/* ---- Toggle ---- */
.gb-toggle {
  position: relative; flex: none;
  width: 52px; height: 32px;
  border-radius: var(--r-pill);
  background: var(--line-strong);
  transition: background-color var(--dur-1) ease, box-shadow var(--dur-1) ease;
}
.gb-toggle::after { content: ""; position: absolute; inset: -6px -2px; }
.gb-toggle__thumb {
  position: absolute; top: 4px; left: 4px;
  width: 24px; height: 24px;
  border-radius: var(--r-pill);
  background: var(--knob);
  box-shadow: 0 1px 3px rgb(var(--shadow-rgb) / 0.3);
  transition: transform var(--dur-2) var(--ease), width var(--dur-1) ease, background-color var(--dur-1) ease;
}
.gb-toggle[aria-checked="true"] { background: var(--accent); }
.gb-toggle[aria-checked="true"] .gb-toggle__thumb { transform: translateX(20px); background: var(--accent-ink); }
.gb-toggle:active:not(:disabled) .gb-toggle__thumb { width: 28px; }
.gb-toggle[aria-checked="true"]:active:not(:disabled) .gb-toggle__thumb { transform: translateX(16px); }
.gb-toggle:disabled { opacity: 0.4; cursor: default; }
[data-style="arcade"] .gb-toggle { background: var(--bg-raised); box-shadow: inset 0 0 0 2px var(--ink); }
[data-style="arcade"] .gb-toggle__thumb { top: 5px; left: 5px; width: 22px; height: 22px; border-radius: 1px; background: var(--ink); box-shadow: none; }
[data-style="arcade"] .gb-toggle[aria-checked="true"] { background: var(--accent); box-shadow: inset 0 0 0 2px var(--ink), inset 0 5px 0 rgb(0 0 0 / 0.2); }
[data-style="arcade"] .gb-toggle[aria-checked="true"] .gb-toggle__thumb { background: var(--accent-ink); box-shadow: 0 0 0 2px var(--ink); }
[data-style="arcade"] .gb-toggle:active:not(:disabled) .gb-toggle__thumb { width: 22px; }
[data-style="arcade"] .gb-toggle[aria-checked="true"]:active:not(:disabled) .gb-toggle__thumb { transform: translateX(20px); }
[data-style="varsity"] .gb-toggle { background: transparent; box-shadow: inset 0 0 0 2px var(--ink); }
[data-style="varsity"] .gb-toggle__thumb { background: var(--ink); box-shadow: none; }
[data-style="varsity"] .gb-toggle[aria-checked="true"] { background: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }

/* ---- Slider (native range) ---- */
.gb-slider {
  -webkit-appearance: none; appearance: none;
  display: block; width: 100%; height: 44px; margin: 0;
  background: transparent; cursor: pointer;
  --track-h: 6px; --thumb: 28px;
}
.gb-slider::-webkit-slider-runnable-track {
  height: var(--track-h); border-radius: var(--r-pill);
  background: linear-gradient(to right, var(--accent) var(--pct), var(--fill-strong) var(--pct));
  box-shadow: inset 0 0 0 1px var(--line);
}
.gb-slider::-moz-range-track {
  height: var(--track-h); border-radius: var(--r-pill);
  background: linear-gradient(to right, var(--accent) var(--pct), var(--fill-strong) var(--pct));
}
.gb-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: var(--thumb); height: var(--thumb); margin-top: calc((var(--track-h) - var(--thumb)) / 2);
  border-radius: var(--r-pill); border: var(--bw) solid var(--line-strong);
  background: var(--knob);
  box-shadow: var(--shadow-1);
  transition: transform var(--dur-1) var(--ease);
}
.gb-slider::-moz-range-thumb {
  width: var(--thumb); height: var(--thumb);
  border-radius: var(--r-pill); border: var(--bw) solid var(--line-strong);
  background: var(--knob);
  box-shadow: var(--shadow-1);
}
.gb-slider:active::-webkit-slider-thumb { transform: scale(1.12); }
.gb-slider:focus-visible { outline: none; }
.gb-slider:focus-visible::-webkit-slider-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
.gb-slider:focus-visible::-moz-range-thumb { outline: 3px solid var(--focus); outline-offset: 2px; }
.gb-slider:disabled { opacity: 0.4; cursor: default; }
[data-style="arcade"] .gb-slider { --track-h: 10px; --thumb: 26px; }
[data-style="arcade"] .gb-slider::-webkit-slider-runnable-track { border-radius: 2px; box-shadow: inset 0 0 0 2px var(--ink); }
[data-style="arcade"] .gb-slider::-webkit-slider-thumb { border-radius: 2px; border-color: var(--ink); }
[data-style="arcade"] .gb-slider::-moz-range-thumb { border-radius: 2px; border-color: var(--ink); }
[data-style="varsity"] .gb-slider { --track-h: 8px; }
[data-style="varsity"] .gb-slider::-webkit-slider-thumb { background: var(--ink); border-color: var(--bg); box-shadow: none; }
[data-style="varsity"] .gb-slider::-moz-range-thumb { background: var(--ink); border-color: var(--bg); box-shadow: none; }

/* ---- Stepper ---- */
.gb-stepper {
  display: inline-flex; align-items: center;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-control);
  background: var(--fill);
}
.gb-stepper__btn {
  display: grid; place-items: center;
  width: 48px; height: 44px;
  border-radius: calc(var(--r-control) - 1px);
  color: var(--ink);
  transition: background-color var(--dur-1) ease, transform var(--dur-1) var(--ease);
}
.gb-stepper__btn:active:not(:disabled) { background: var(--fill-strong); transform: var(--press); }
.gb-stepper__btn:disabled { color: var(--ink-3); opacity: 0.45; cursor: default; }
.gb-stepper__value { min-width: 58px; padding: 0 2px; text-align: center; font-size: calc(20px * var(--num-scale)); color: var(--ink); }
.gb-stepper__unit { margin-left: 3px; font: 500 13px/1 var(--font-ui); letter-spacing: 0; color: var(--ink-2); }
[data-style="arcade"] .gb-stepper { background: var(--bg-raised); }
[data-style="arcade"] .gb-stepper__value { font-size: 30px; }
[data-style="arcade"] .gb-numfield__input { font-size: 30px; }
[data-style="arcade"] .gb-numfield--m .gb-numfield__input { font-size: 30px; }
[data-style="varsity"] .gb-stepper { background: transparent; }

/* ---- Fields ---- */
.gb-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gb-field__label {
  font: var(--label-weight) var(--t-sublabel) var(--font-label);
  letter-spacing: var(--label-track); text-transform: var(--label-case);
  color: var(--ink-2);
}
.gb-field__note { display: flex; align-items: center; gap: 5px; font: 400 13px/18px var(--font-ui); color: var(--ink-2); }
.gb-field__note.is-error { color: var(--bad); }

.gb-textfield__box {
  display: flex; align-items: center; gap: 10px;
  min-height: 50px; padding: 0 14px;
  border: var(--bw) solid var(--line-strong); border-radius: var(--r-m);
  background: var(--bg-raised); color: var(--ink-2);
  transition: border-color var(--dur-1) ease, box-shadow var(--dur-1) ease;
}
.gb-textfield__box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
.gb-textfield__input {
  flex: 1; min-width: 0;
  padding: 13px 0; border: 0; background: none; outline: none; resize: none;
  font: 400 17px/22px var(--font-ui); color: var(--ink);
}
.gb-textfield.is-error .gb-textfield__box { border-color: var(--bad); }
.gb-textfield__input:disabled { color: var(--ink-3); }
[data-style="arcade"] .gb-textfield__box, [data-style="arcade"] .gb-numfield__box { border-color: var(--ink); box-shadow: inset 0 3px 0 var(--fill); }
[data-style="arcade"] .gb-textfield__box:focus-within, [data-style="arcade"] .gb-numfield__box:focus-within { box-shadow: inset 0 3px 0 var(--fill), 0 0 0 3px var(--accent-soft); border-color: var(--ink); }
[data-style="arcade"] .gb-textfield.is-error .gb-textfield__box { border-color: var(--bad); }

.gb-numfield__box {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  height: 56px;
  border: var(--bw) solid var(--line-strong); border-radius: var(--r-m);
  background: var(--bg-raised);
  transition: border-color var(--dur-1) ease, box-shadow var(--dur-1) ease;
}
.gb-numfield__box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
.gb-numfield__input {
  width: 100%; height: 100%; padding: 0 8px;
  border: 0; background: none; outline: none; text-align: center;
  font-size: calc(24px * var(--num-scale)); color: var(--ink);
}
.gb-numfield__unit { position: absolute; right: 12px; bottom: 50%; transform: translateY(50%); font: 500 13px/1 var(--font-ui); color: var(--ink-2); pointer-events: none; }
.gb-numfield--m .gb-numfield__box { height: 44px; border-radius: var(--r-s); }
.gb-numfield--m .gb-numfield__input { font-size: calc(19px * var(--num-scale)); }
.gb-numfield__input:disabled { color: var(--ink-3); }

/* 22-content.css */
/* Content: sections, lists, the one allowed card, stats, points, badges, avatars, empty and loading states, meters. */

/* ---- Section ---- */
.gb-section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.gb-section__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; min-height: 26px; }
.gb-section__title {
  font: var(--display-style) var(--display-weight) var(--t-section) var(--font-display);
  letter-spacing: var(--display-track); text-transform: var(--display-case);
  color: var(--ink);
}
.gb-section__action {
  position: relative; flex: none;
  font: 600 15px/20px var(--font-ui); color: var(--accent-text);
  border-radius: var(--r-s);
}
.gb-section__action::after { content: ""; position: absolute; inset: -12px; }
.gb-section__action:active { opacity: 0.6; }
.gb-section__foot { font: 400 13px/18px var(--font-ui); color: var(--ink-2); padding-inline: 2px; }

/* ---- List and ListRow ---- */
.gb-list { display: flex; flex-direction: column; min-width: 0; }
.gb-list--inset {
  overflow: hidden;
  border: var(--bw) solid var(--edge); border-radius: var(--r-l);
  background: var(--bg-raised);
}
.gb-list__item { position: relative; }
.gb-list__item + .gb-list__item::before {
  content: ""; position: absolute; top: 0; left: 16px; right: 0; z-index: 1;
  height: 1px; background: var(--line);
}
.gb-list--plain .gb-list__item + .gb-list__item::before { left: 0; }
.gb-row {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  width: 100%; min-height: 54px; padding: 10px 16px;
  color: var(--ink); text-align: left;
  transition: background-color var(--dur-1) ease;
}
.gb-list--plain .gb-row { padding-inline: 0; }
button.gb-row:active:not(:disabled) { background: var(--fill); }
button.gb-row:disabled { opacity: 0.4; cursor: default; }
button.gb-row:focus-visible { outline-offset: -3px; }
@media (hover: hover) and (pointer: fine) { button.gb-row:hover:not(:disabled) { background: var(--fill); } }
.gb-row__leading { flex: none; display: grid; place-items: center; min-width: 28px; color: var(--accent-text); }
.gb-row__text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.gb-row__title { font: 400 17px/22px var(--font-ui); overflow-wrap: anywhere; }
.gb-row__subtitle { font: 400 15px/20px var(--font-ui); color: var(--ink-2); }
.gb-row__value { flex: none; font: 400 17px/22px var(--font-ui); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.gb-row__trailing { flex: none; display: flex; align-items: center; gap: 8px; }
.gb-row__chevron { flex: none; color: var(--ink-3); margin-right: -2px; }
.gb-row__check { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: var(--r-avatar); color: var(--accent-ink); background: var(--accent); transition: background-color var(--dur-1) ease; }
.gb-row__check > svg { transition: transform var(--dur-2) var(--ease), opacity var(--dur-1) ease; }
.gb-row__check[data-on="false"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.gb-row__check[data-on="false"] > svg { opacity: 0; transform: scale(0.4); }
.gb-row--bad, .gb-row--bad .gb-row__leading { color: var(--bad); }
[data-style="arcade"] .gb-list__item + .gb-list__item::before { left: 0; height: 2px; }
[data-style="arcade"] .gb-row__title, [data-style="varsity"] .gb-row__title { font-weight: 600; }
[data-style="arcade"] .gb-row__check, [data-style="arcade"] .gb-row__check[data-on="false"] { box-shadow: inset 0 0 0 2px var(--ink); }
[data-style="varsity"] .gb-list--inset { box-shadow: var(--shadow-1); }

/* ---- Card: one level only ---- */
.gb-card {
  display: block; width: 100%;
  border: var(--bw) solid var(--edge); border-radius: var(--r-l);
  background: var(--bg-raised); color: inherit; text-align: left;
  box-shadow: var(--shadow-1);
}
.gb-card--padded { padding: 16px; }
.gb-card--tap { transition: transform var(--dur-1) var(--ease); }
.gb-card--tap:active { transform: var(--press); }
/* A surface inside a surface gives up its own: nesting can never look like cards in cards. */
.gb-card .gb-card, .gb-card .gb-list--inset, .gb-list--inset .gb-card, .gb-list--inset .gb-list--inset {
  padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; overflow: visible;
}
.gb-card .gb-list--inset .gb-row, .gb-list--inset .gb-list--inset .gb-row { padding-inline: 0; }
.gb-card .gb-list--inset .gb-list__item + .gb-list__item::before { left: 0; }

/* ---- Stat ---- */
.gb-statrow { display: flex; align-items: stretch; min-width: 0; }
.gb-statrow > .gb-stat { flex: 1 1 0; min-width: max-content; padding-inline: 14px; }
.gb-statrow > .gb-stat:first-child { padding-left: 0; }
.gb-statrow > .gb-stat:last-child { padding-right: 0; }
.gb-statrow > .gb-stat + .gb-stat { border-left: 1px solid var(--line); }
.gb-stat { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.gb-stat__value { font-size: calc(26px * var(--num-scale)); line-height: 1.05; color: var(--ink); white-space: nowrap; }
.gb-stat--l .gb-stat__value { font-size: calc(40px * var(--num-scale)); }
.gb-stat__unit { margin-left: 3px; font: 600 14px/1 var(--font-ui); letter-spacing: 0; color: var(--ink-2); }
.gb-stat__label { font: 400 13px/18px var(--font-ui); color: var(--ink-2); }
.gb-stat__delta { font: 600 13px/18px var(--font-ui); font-variant-numeric: tabular-nums; }
[data-style="arcade"] .gb-statrow > .gb-stat + .gb-stat { border-left-width: 2px; }
[data-style="arcade"] .gb-stat__value { font-size: 30px; }
[data-style="arcade"] .gb-stat--l .gb-stat__value { font-size: 45px; }

/* ---- Points ---- */
.gb-points-glyph { flex: none; overflow: visible; }
.gb-points-glyph__coin { fill: var(--points); stroke: var(--points-edge); stroke-width: 18; }
.gb-points-glyph__bolt { fill: var(--points-ink); }
.gb-points { display: inline-flex; align-items: center; gap: 5px; font-size: 17px; line-height: 1; color: var(--ink); white-space: nowrap; vertical-align: middle; }
.gb-points--s { gap: 4px; font-size: 14px; }
.gb-points--l { gap: 7px; font-size: 24px; }
.gb-pointspill {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 6px;
  height: 36px; padding: 0 12px 0 9px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-pill);
  background: var(--fill); color: var(--ink);
  font-size: 17px; line-height: 1;
  transition: transform var(--dur-1) var(--ease);
}
button.gb-pointspill::after { content: ""; position: absolute; inset: -5px -2px; }
button.gb-pointspill:active { transform: var(--press); }
[data-style="arcade"] .gb-pointspill { background: var(--bg-raised); box-shadow: inset 0 -3px 0 var(--fill-strong); }
[data-style="varsity"] .gb-pointspill { background: var(--bg-inverse); color: var(--ink-inverse); border-color: transparent; }

/* ---- Badge ---- */
.gb-badge {
  display: inline-flex; align-items: center; flex: none;
  height: 22px; padding: 0 8px;
  border-radius: var(--r-pill);
  background: var(--fill); color: var(--ink-2);
  font: 600 12px/16px var(--font-ui); white-space: nowrap;
}
.gb-badge__in { display: inline-flex; align-items: center; gap: 4px; }
.gb-badge--accent { background: var(--accent-soft); color: var(--accent-text); }
.gb-badge--good { background: var(--good-soft); color: var(--good); }
.gb-badge--warn { background: var(--warn-soft); color: var(--warn); }
.gb-badge--bad { background: var(--bad-soft); color: var(--bad); }
.gb-badge--points { background: rgb(244 180 26 / 0.2); color: var(--points-text); }
.gb-badge--solid.gb-badge--neutral { background: var(--ink); color: var(--bg); }
.gb-badge--solid.gb-badge--accent { background: var(--accent); color: var(--accent-ink); }
.gb-badge--solid.gb-badge--good { background: var(--good); color: var(--on-semantic); }
.gb-badge--solid.gb-badge--warn { background: var(--warn); color: var(--on-semantic); }
.gb-badge--solid.gb-badge--bad { background: var(--bad); color: var(--on-semantic); }
.gb-badge--solid.gb-badge--points { background: var(--points); color: var(--points-ink); }
[data-style="arcade"] .gb-badge { padding: 0 6px; border: 2px solid currentColor; font-weight: 700; }
[data-style="arcade"] .gb-badge--solid { border-color: var(--ink); }
/* varsity: the second (and last) place the slant appears */
[data-style="varsity"] .gb-badge { border-radius: 5px; transform: skewX(-12deg); font: 600 13px/14px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; }
[data-style="varsity"] .gb-badge__in { transform: skewX(12deg); }

/* ---- Avatar ---- */
.gb-avatar {
  position: relative; flex: none; overflow: hidden;
  display: inline-grid; place-items: center;
  border-radius: var(--r-avatar);
  background: var(--accent-soft); color: var(--accent-text);
}
.gb-avatar > canvas, .gb-avatar > svg, .gb-avatar > img { width: 100%; height: 100%; object-fit: cover; }
.gb-avatar__initials { font: 600 1em/1 var(--font-ui); letter-spacing: 0.01em; }
.gb-avatar--ring { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
[data-style="arcade"] .gb-avatar { border: 2px solid var(--ink); }
[data-style="arcade"] .gb-avatar__initials { font-weight: 800; }
[data-style="varsity"] .gb-avatar { background: var(--accent); color: var(--accent-ink); }
[data-style="varsity"] .gb-avatar__initials { font: italic 800 1.15em/1 var(--font-display); }

/* ---- EmptyState ---- */
.gb-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 16px; text-align: center; }
.gb-empty__icon {
  display: grid; place-items: center;
  width: 68px; height: 68px; margin-bottom: 10px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-l);
  background: var(--accent-soft); color: var(--accent-text);
}
.gb-empty__text { max-width: 31ch; font: 400 16px/22px var(--font-ui); color: var(--ink-2); text-wrap: pretty; }
.gb-empty__action { margin-top: 14px; }
[data-style="arcade"] .gb-empty__icon { background: var(--bg-raised); box-shadow: var(--shadow-1); }
[data-style="varsity"] .gb-empty__icon { border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink); transform: skewX(-10deg); }
[data-style="varsity"] .gb-empty__icon > svg { transform: skewX(10deg); }

/* ---- Skeleton ---- */
.gb-skeleton { position: relative; display: block; overflow: hidden; border-radius: var(--r-s); background: var(--fill); }
.gb-skeleton--text { border-radius: var(--r-pill); }
.gb-skeleton--circle { border-radius: var(--r-avatar); }
.gb-skeleton::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, var(--fill-strong), transparent);
  transform: translateX(-100%);
  animation: gb-shimmer 1500ms ease-in-out infinite;
}
[data-style="arcade"] .gb-skeleton::after { background: var(--fill-strong); transform: none; animation: gb-blink 900ms steps(2, jump-none) infinite; }
@keyframes gb-shimmer { to { transform: translateX(100%); } }
@keyframes gb-blink { from { opacity: 0; } to { opacity: 1; } }

/* ---- ProgressRing ---- */
.gb-ring { position: relative; flex: none; display: inline-grid; place-items: center; }
.gb-ring > svg { position: absolute; inset: 0; }
.gb-ring__track { stroke: var(--fill-strong); }
.gb-ring__value { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset var(--dur-2) var(--ease-move); }
.gb-ring--good .gb-ring__value { stroke: var(--good); }
.gb-ring--points .gb-ring__value { stroke: var(--points); }
.gb-ring__center { position: relative; display: grid; place-items: center; color: var(--ink); }
[data-style="arcade"] .gb-ring__value, [data-style="varsity"] .gb-ring__value { stroke-linecap: butt; }
[data-style="arcade"] .gb-ring__track { stroke: var(--line-strong); }

/* ---- Meter ---- */
.gb-meter { display: block; overflow: hidden; height: 8px; border-radius: var(--r-pill); background: var(--fill-strong); }
.gb-meter__fill { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--dur-2) var(--ease-move); }
.gb-meter--good .gb-meter__fill { background: var(--good); }
.gb-meter--warn .gb-meter__fill { background: var(--warn); }
.gb-meter--bad .gb-meter__fill { background: var(--bad); }
.gb-meter--points .gb-meter__fill { background: var(--points); }
/* arcade: a segmented energy bar */
[data-style="arcade"] .gb-meter { height: 16px; padding: 2px; border: 2px solid var(--ink); border-radius: 2px; background: var(--bg-raised); }
[data-style="arcade"] .gb-meter__fill { border-radius: 0; -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); mask-image: repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 10px); }
[data-style="varsity"] .gb-meter { height: 10px; border-radius: 3px; transform: skewX(-14deg); }

/* 30-overlays.css */
/* Overlays: everything here lives in the stage's overlay layer (above the tab bar), or floats inside a Screen (Fab). */
.gb-overlays { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.gb-overlays > * { pointer-events: auto; }
.gb-scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; transition: opacity var(--dur-2) ease; }
.is-open > .gb-scrim { opacity: 1; }

/* ---- Sheet ---- */
.gb-sheetlayer { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; }
.gb-sheet {
  position: relative;
  display: flex; flex-direction: column;
  max-height: calc(100% - var(--safe-t) - 30px);
  border-radius: var(--r-l) var(--r-l) 0 0;
  background: var(--bg);
  box-shadow: 0 -1px 0 var(--line), 0 -18px 50px -18px rgb(var(--shadow-rgb) / calc(0.4 * var(--shadow-k)));
  transform: translateY(104%);
  transition: transform var(--dur-2) var(--ease-move), height var(--dur-2) var(--ease-move);
}
.gb-sheet:focus, .gb-dialog:focus { outline: none; }
.is-open > .gb-sheet { transform: none; }
.gb-sheet.is-dragging { transition: none; }
.gb-sheet--medium { height: 54%; }
.gb-sheet--large { height: calc(100% - var(--safe-t) - 30px); }
.gb-sheet--auto { height: auto; }
.gb-sheet__handle { flex: none; padding-top: 7px; touch-action: none; cursor: grab; }
.gb-sheet__grabber { display: block; width: 38px; height: 5px; margin: 0 auto; border-radius: var(--r-pill); background: var(--line-strong); }
.gb-sheet__bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px; padding: 0 calc(var(--gutter) - 8px) 4px var(--gutter); }
.gb-sheet__title {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font: var(--display-style) var(--display-weight) var(--t-title) var(--font-display);
  letter-spacing: var(--display-track); text-transform: var(--display-case);
  padding-right: 0.08em;
}
.gb-sheet__trailing { flex: none; display: flex; align-items: center; }
.gb-sheet__body { flex: 1; min-height: 0; padding: 6px var(--gutter) calc(var(--safe-b) + 28px); }
[data-style="arcade"] .gb-sheet { border-top: 2px solid var(--ink); box-shadow: none; }
[data-style="arcade"] .gb-sheet__grabber { width: 44px; height: 6px; border-radius: 1px; background: var(--ink); }

/* ---- Dialog ---- */
.gb-dialoglayer { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 28px; }
.gb-dialog {
  position: relative;
  width: min(100%, 304px); padding: 22px 18px 16px;
  border: var(--bw) solid var(--edge); border-radius: var(--r-l);
  background: var(--bg-raised);
  box-shadow: var(--shadow-2);
  text-align: center;
  opacity: 0; transform: scale(1.07);
  transition: opacity var(--dur-1) ease, transform var(--dur-2) var(--ease);
}
.is-open > .gb-dialog { opacity: 1; transform: none; }
.gb-dialog__title { font: 600 18px/23px var(--font-ui); letter-spacing: -0.01em; text-wrap: balance; }
.gb-dialog__msg { margin-top: 6px; font: 400 15px/21px var(--font-ui); color: var(--ink-2); text-wrap: pretty; }
.gb-dialog__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
[data-style="arcade"] .gb-dialog { transform: translateY(8px); }
[data-style="arcade"] .is-open > .gb-dialog { transform: none; }
[data-style="arcade"] .gb-dialog__title, [data-style="varsity"] .gb-dialog__title { font-weight: 700; }

/* ---- Toast ---- */
.gb-toast {
  position: absolute; left: 50%; bottom: calc(var(--tabbar-space) + 16px); z-index: 3;
  display: inline-flex; align-items: center; gap: 8px;
  max-width: calc(100% - 32px); padding: 11px 16px 11px 13px;
  border-radius: var(--r-pill);
  background: var(--bg-inverse); color: var(--ink-inverse);
  box-shadow: 0 0 0 1px var(--line), var(--shadow-2);
  font: 600 15px/20px var(--font-ui); white-space: nowrap;
  pointer-events: none;
  opacity: 0; transform: translate(-50%, 14px);
  transition: opacity var(--dur-1) ease, transform var(--dur-2) var(--ease);
}
.gb-overlays > .gb-toast { pointer-events: none; }
.gb-toast.is-open { opacity: 1; transform: translate(-50%, 0); }
.gb-toast > svg { color: var(--accent-inverse); }
[data-style="arcade"] .gb-toast { border: 2px solid var(--ink-inverse); box-shadow: var(--shadow-2); }

/* ---- Fab and FabMenu ---- */
.gb-fabscrim {
  position: absolute; inset: 0; z-index: 6;
  background: var(--scrim);
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-2) ease;
}
.gb-fabscrim.is-open { opacity: 1; pointer-events: auto; }
.gb-fabwrap {
  position: absolute; right: var(--gutter); bottom: calc(var(--bottom-inset, 0px) + 16px); z-index: 7;
  display: flex; flex-direction: column; align-items: flex-end; gap: 14px;
  pointer-events: none;
}
.gb-fabwrap > * { pointer-events: auto; }
.gb-fab {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-width: 58px; height: 58px; padding: 0 16px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-fab);
  background: var(--accent); color: var(--accent-ink);
  box-shadow: var(--shadow-2);
  font: 600 17px/22px var(--font-ui);
  transition: transform var(--dur-1) var(--ease), filter var(--dur-1) ease;
}
.gb-fab--extended { padding: 0 22px 0 18px; }
.gb-fab:active { transform: var(--press); filter: brightness(0.93); }
.gb-fab__glyph { display: grid; transition: transform var(--dur-2) var(--ease); }
.gb-fabwrap.is-open .gb-fab__glyph { transform: rotate(90deg); }
[data-style="arcade"] .gb-fab { box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.2), inset 0 2px 0 rgb(255 255 255 / 0.3), var(--shadow-2); }
[data-style="arcade"] .gb-fab:active { box-shadow: inset 0 3px 0 rgb(0 0 0 / 0.22), 2px 2px 0 rgb(var(--shadow-rgb) / 0.3); filter: none; }
[data-style="arcade"] .gb-fabwrap.is-open .gb-fab__glyph { transform: none; }
[data-style="varsity"] .gb-fab { border-color: transparent; }

.gb-fabmenu { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; visibility: hidden; transition: visibility 0s linear var(--dur-2); }
.gb-fabwrap.is-open .gb-fabmenu { visibility: visible; transition-delay: 0s; }
.gb-fabmenu > li {
  opacity: 0; transform: translateY(16px) scale(0.92); transform-origin: 100% 100%;
  transition: opacity var(--dur-1) ease, transform var(--dur-2) var(--ease);
}
.gb-fabwrap.is-open .gb-fabmenu > li { opacity: 1; transform: none; transition-delay: calc(var(--i) * 34ms); }
.gb-fabaction { display: inline-flex; align-items: center; gap: 12px; min-height: 48px; transition: transform var(--dur-1) var(--ease); }
.gb-fabaction:active { transform: var(--press); }
.gb-fabaction__label {
  padding: 9px 14px;
  border: var(--bw) solid var(--edge); border-radius: var(--r-pill);
  background: var(--bg-raised); color: var(--ink);
  box-shadow: var(--shadow-1);
  font: 600 16px/20px var(--font-ui);
}
.gb-fabaction__icon {
  display: grid; place-items: center;
  width: 48px; height: 48px; margin-right: 5px;
  border: var(--bw) solid var(--edge); border-radius: var(--r-fab);
  background: var(--bg-raised); color: var(--accent-text);
  box-shadow: var(--shadow-1);
}
[data-style="arcade"] .gb-fabaction__label, [data-style="arcade"] .gb-fabaction__icon { font-weight: 700; }
[data-style="varsity"] .gb-fabaction__label { background: var(--bg-inverse); color: var(--ink-inverse); font-weight: 700; }
[data-style="varsity"] .gb-fabaction__icon { background: var(--bg-inverse); color: var(--accent-inverse); }

/* 32-panel.css */
/* Prototype controls (desktop panel and phone sheet) and the dev kit gallery. */
.gb-panel {
  flex: 0 1 372px; min-width: 268px; max-height: 100%;
  display: flex; flex-direction: column; gap: 6px;
  padding: 28px 6px;
}
.gb-panel__lede { margin-bottom: 16px; font: 400 15px/21px var(--font-ui); color: var(--ink-2); }
.gb-controls { display: flex; flex-direction: column; gap: 22px; }
.gb-controls__skips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }

.gb-swatches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.gb-swatch {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 6px 0 4px;
  border-radius: var(--r-m);
  background: none;
  transition: transform var(--dur-1) var(--ease);
}
.gb-swatch:active { transform: var(--press); }
.gb-swatch__dot {
  display: grid; place-items: center;
  width: 44px; height: 44px;
  border: var(--bw) solid var(--edge-control); border-radius: var(--r-avatar);
  background: var(--accent); color: var(--accent-ink);
  transition: box-shadow var(--dur-1) ease;
}
.gb-swatch__dot > svg { opacity: 0; transform: scale(0.5); transition: opacity var(--dur-1) ease, transform var(--dur-2) var(--ease); }
.gb-swatch[aria-checked="true"] .gb-swatch__dot { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.gb-swatch[aria-checked="true"] .gb-swatch__dot > svg { opacity: 1; transform: none; }
.gb-swatch__name { font: 500 12px/16px var(--font-ui); color: var(--ink-2); }
.gb-swatch[aria-checked="true"] .gb-swatch__name { color: var(--ink); font-weight: 600; }

/* ---- dev kit gallery (dev/kit.jsx) ---- */
.kit { position: relative; height: 100%; --tabbar-space: 0px; }
.kit-top { display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 4px; max-width: 1240px; margin: 0 auto; }
.kit-top__row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.kit-top__row > .gb-seg { flex: 1 1 240px; max-width: 360px; }
.kit-swatches { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.kit-chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/16px var(--font-ui); color: var(--ink-2); }
.kit-chip > i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--line); }
.kit-cols { display: flex; justify-content: center; align-items: flex-start; gap: 24px; padding: 12px 0 48px; }
.kit-col { flex: 0 1 402px; min-width: 0; display: flex; flex-direction: column; gap: 30px; padding: 20px var(--gutter) 28px; background: var(--bg); }
.kit-col__head { display: flex; flex-direction: column; gap: 6px; }
.kit-block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.kit-block__title { font: 600 12px/16px var(--font-ui); color: var(--ink-3); padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.kit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.kit-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.kit-setrow { display: grid; grid-template-columns: 34px 1fr 1fr 44px; align-items: center; gap: 10px; }
.kit-cardhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.kit-cardhead--flush { margin-bottom: 0; }
.kit-meters { display: flex; flex-direction: column; gap: 12px; }
.kit-skeleton { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center; }
.kit-skeleton > div { display: flex; flex-direction: column; gap: 8px; }
.kit-stage { position: relative; overflow: hidden; border: 1px dashed var(--line-strong); border-radius: var(--r-m); --safe-t: 0px; --safe-b: 0px; --bottom-inset: 0px; }
.kit-stage--nav { height: 56px; }
.kit-stage--fab { height: 350px; }
.kit-stage--tabs { height: 92px; --tabbar-bottom: 10px; }
/* demo screens (dist/dev-kit.html?demo) */
.kit-stack { display: flex; flex-direction: column; gap: 12px; }
.kit-post { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.kit-post__who { flex: 1; min-width: 0; }
.kit-post__foot { display: flex; gap: 4px; margin: 8px -10px -10px; }
.kit-sets { display: flex; flex-direction: column; gap: 8px; }
.kit-balance { display: flex; flex-direction: column; gap: 12px; }
.kit-balance__row { display: grid; grid-template-columns: 108px 1fr; align-items: center; gap: 12px; }
.kit-room { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--top-inset) var(--gutter) var(--bottom-inset); background: var(--bg-sunken); text-align: center; }
.kit-room > p { padding: 28px 16px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); }
.kit-stage--nav .gb-fabwrap { bottom: 6px; right: 8px; transform: scale(0.76); transform-origin: 100% 100%; }

/* 50-workout.css */
/* Workout flow: Home, Train, the session, its summary and the workout page.
   Layout only. Every colour, radius, face and duration comes from a token or a kit class. */

/* ---- shared arrangement ---- */
.wk-stack { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.wk-stack--loose { gap: var(--s-5); }
.wk-grow { flex: 1; min-width: 0; }
.wk-block { display: block; }
.wk-nowrap { white-space: nowrap; }
.wk-tnum { font-variant-numeric: tabular-nums; }
.wk-ink { color: var(--ink); }
.wk-inline { display: inline-flex; align-items: center; gap: 6px; }
.wk-line { display: flex; align-items: flex-start; gap: var(--s-2); min-width: 0; }
.wk-line > svg { flex: none; margin-top: 2px; }
.wk-line > .gb-badge { margin-top: -1px; }
.wk-rate { vertical-align: -2px; color: inherit; }
.wk-rate .t-num { color: var(--ink); }

/* ---- start and resume ---- */
.wk-start { display: flex; flex-direction: column; gap: var(--s-3); }
.wk-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
/* Two equal buttons side by side; on the narrowest phones they stack instead of running off the edge. */
.wk-start__more { display: flex; flex-wrap: wrap; gap: var(--s-3); }
.wk-start__more > .gb-btn { flex: 1 1 0; width: auto; padding-inline: var(--s-2); }
.wk-resume { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s-4); }

/* ---- game status and focus offer ---- */
.wk-status { display: flex; flex-direction: column; gap: var(--s-1); }
.wk-status__main { display: flex; align-items: center; flex-wrap: wrap; column-gap: var(--s-2); }
.wk-status__main > .t-callout { margin-left: auto; }
.wk-focus { display: flex; flex-direction: column; gap: var(--s-3); }
.wk-focus__head { display: flex; align-items: flex-start; gap: var(--s-3); }
.wk-focus__head .t-foot { margin-top: 2px; }

/* ---- timeline posts and routine cards ---- */
.wk-feed { display: flex; flex-direction: column; gap: var(--s-3); }
.wk-post__tap {
  display: flex; flex-direction: column; gap: var(--s-3);
  width: 100%; padding: var(--s-4);
  border-radius: inherit;
  transition: transform var(--dur-1) var(--ease);
}
.wk-post__tap:active { transform: var(--press); }
.wk-post__tap:focus-visible { outline-offset: -3px; }
.wk-post__head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--s-3); }
.wk-post__who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.wk-post__name { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
.wk-post__side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.wk-post__lifts { display: block; }
.wk-post__foot {
  display: flex; align-items: center; justify-content: space-between; gap: var(--s-3);
  min-height: 52px; padding: var(--s-2) var(--s-4);
  border-top: 1px solid var(--line);
}
.wk-routine { display: flex; flex-direction: column; gap: 3px; }
.wk-routine__head { display: flex; align-items: center; gap: var(--s-2); min-width: 0; margin-bottom: 1px; }

/* ---- session ---- */
.wk-session > .gb-screen__body { padding-top: 0; padding-bottom: calc(var(--bottom-inset, 0px) + 96px); }
.wk-namebox { display: flex; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
.wk-namebox > svg { flex: none; }
.wk-name {
  min-width: 0; max-width: 100%; height: var(--tap); padding: 0 4px;
  border: 0; border-radius: var(--r-s); outline: none;
  background: none; color: var(--ink);
  font: inherit; font-size: max(16px, 1em); letter-spacing: inherit; text-transform: inherit; text-align: center; text-overflow: ellipsis;
  transition: background-color var(--dur-1) ease;
}
.wk-name:focus { background: var(--fill); box-shadow: inset 0 -2px 0 var(--focus); }

/* the clock, volume and points stay in view while the sets scroll under them */
.wk-top {
  position: sticky; top: 0; z-index: 3;
  display: flex; flex-direction: column; gap: var(--s-2);
  padding: calc(var(--top-inset) + var(--s-2)) var(--gutter) var(--s-3);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wk-meter { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) auto; align-items: end; column-gap: var(--s-4); }
.wk-meter__cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.wk-meter__cell--end { align-items: flex-end; }
.wk-meter__clock { font-size: calc(40px * var(--num-scale)); }
.wk-tick { display: inline-flex; animation: wk-tick var(--dur-2) var(--ease) both; }
@keyframes wk-tick { from { transform: translateY(5px); opacity: 0.4; } to { transform: none; opacity: 1; } }
.wk-rest { display: flex; align-items: center; gap: var(--s-3); }

.wk-buddies { display: flex; align-items: center; gap: var(--s-3); }
.wk-buddies__faces { display: flex; flex: none; }
.wk-buddies__faces > * + * { margin-left: -10px; }

.wk-ex { display: flex; flex-direction: column; gap: var(--s-2); min-width: 0; --gbx-ground: var(--bg); }
.wk-ex__head { display: flex; align-items: center; gap: 2px; margin-right: -10px; }
.wk-ex__title {
  flex: 1; min-width: 0; min-height: var(--tap);
  display: flex; align-items: center; gap: var(--s-3);
  border-radius: var(--r-s);
  transition: opacity var(--dur-1) ease;
}
button.wk-ex__title:active { opacity: 0.55; }
.wk-ex__title > svg { flex: none; }
.wk-ex__text { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.wk-ex__name { display: flex; align-items: center; gap: var(--s-2); max-width: 100%; }

.wk-sets { display: flex; flex-direction: column; gap: 2px; }
.wk-sets__cols, .wk-set {
  display: grid; grid-template-columns: var(--tap) minmax(0, 1fr) minmax(0, 1fr) var(--tap);
  align-items: center; column-gap: var(--s-2);
}
.wk-sets--plan .wk-sets__cols, .wk-sets--plan .wk-set { grid-template-columns: var(--tap) minmax(0, 1fr) minmax(0, 1fr); }
.wk-sets__cols > span { text-align: center; }
.wk-set { position: relative; padding: 3px 0; }
.wk-set > * { position: relative; }
.wk-set::before {
  content: ""; position: absolute; inset: 0 -6px;
  border-radius: var(--r-s);
  background: var(--accent-soft);
  opacity: 0; transition: opacity var(--dur-1) ease;
}
.wk-set[data-done="true"]::before { opacity: 1; }
.wk-set[data-fresh="true"]::before { animation: wk-set-pulse var(--dur-2) var(--ease) both; }
.wk-set[data-fresh="true"] .gb-iconbtn { animation: wk-set-pop var(--dur-2) var(--ease) both; }
@keyframes wk-set-pulse { from { background: var(--accent); opacity: 0.5; transform: scaleX(0.97); } to { background: var(--accent-soft); opacity: 1; transform: none; } }
@keyframes wk-set-pop { 0% { transform: scale(0.8); } 60% { transform: scale(1.12); } 100% { transform: none; } }
.wk-set__type {
  display: grid; place-items: center;
  width: var(--tap); height: var(--tap);
  border-radius: var(--r-s);
  transition: transform var(--dur-1) var(--ease);
}
.wk-set__type:active { transform: var(--press); }
.wk-set__type > .gb-badge { min-width: 28px; justify-content: center; }

/* an exercise page opened from inside the session slides over it */
.wk-subpage {
  position: absolute; inset: 0; z-index: 8;
  background: var(--bg);
  animation: wk-subpage-in var(--dur-2) var(--ease-move) both;
}
@keyframes wk-subpage-in { from { transform: translateX(100%); } to { transform: none; } }

/* ---- exercise picker: search and filters stay put, the list scrolls, the add button sits under it ---- */
.wk-picker { display: flex; flex-direction: column; gap: var(--s-3); height: 100%; min-height: 0; }
.wk-picker__list { flex: 1; min-height: 0; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); --gbx-ground: var(--bg); }

/* ---- summary ---- */
.wk-hero { display: flex; flex-direction: column; align-items: center; gap: var(--s-2); padding-top: var(--s-3); text-align: center; }
.wk-hero__points { display: inline-flex; align-items: center; gap: var(--s-3); }
.wk-hero__num { font-size: calc(64px * var(--num-scale)); }

.wk-breakdown { display: flex; flex-direction: column; }
.wk-breakdown__line { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 42px; }
.wk-breakdown__line + .wk-breakdown__line { border-top: 1px solid var(--line); }
.wk-breakdown__total { min-height: 54px; border-top-color: var(--line-strong); }

/* ---- workout page ---- */
.wk-log { display: flex; flex-direction: column; --gbx-ground: var(--bg); }
.wk-log__ex { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3) 0 var(--s-4); }
.wk-log__ex + .wk-log__ex { border-top: 1px solid var(--line); }
.wk-log__sets { display: flex; flex-direction: column; gap: var(--s-2); padding-left: calc(44px + var(--s-3)); }
.wk-log__set { display: flex; align-items: center; gap: var(--s-3); min-height: 24px; }
.wk-log__set > .gb-badge { min-width: 28px; justify-content: center; }

/* 52-progress.css */
/* Progress: layout only. Every colour, radius, weight and face comes from tokens, so one sheet serves all styles and themes. */

.pg-tabular { font-variant-numeric: tabular-nums; }

/* ---- Overview ---- */
.pg-overview { display: flex; flex-direction: column; gap: 18px; }
.pg-stats { display: flex; flex-direction: column; }
.pg-stats > .gb-statrow + .gb-statrow { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.pg-stats > .gb-statrow > .gb-stat { flex: 1 1 50%; min-width: 0; }
.pg-stats .gb-stat__value { white-space: normal; }

/* ---- Consistency ---- */
.pg-level { display: flex; flex-direction: column; gap: 12px; }
.pg-levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.pg-levels__step { display: flex; flex-direction: column; gap: 6px; color: var(--ink-3); }
.pg-levels__bar { height: 6px; border-radius: var(--r-pill); background: var(--fill-strong); }
.pg-levels__step.is-reached .pg-levels__bar { background: var(--accent); }
.pg-levels__step.is-current { color: var(--ink); }
.pg-rate { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pg-rate > .gb-points-glyph { align-self: center; }

.pg-plot { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; }
.pg-plot__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pg-key { display: flex; align-items: center; gap: 8px; }
.pg-key__line { flex: none; }

.pg-next { display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
.pg-facts { display: flex; flex-direction: column; }
.pg-fact { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.pg-fact + .pg-fact { border-top: 1px solid var(--line); }
.pg-fact__value { flex: none; display: flex; align-items: center; gap: 8px; }

/* ---- Charts ---- */
.pg-chart { position: relative; display: block; width: 100%; }
.pg-chart > svg { display: block; overflow: visible; }
.pg-chart__hit {
  position: absolute; inset: 0;
  border-radius: var(--r-s);
  touch-action: pan-y; cursor: crosshair;
  -webkit-tap-highlight-color: transparent;
}
.pg-chart__hit:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.pg-chart__grid { stroke: var(--chart-grid); stroke-width: 1; shape-rendering: crispEdges; }
.pg-chart__tick { fill: var(--chart-axis); }
.pg-chart__line {
  fill: none; stroke: var(--chart-line);
  stroke-width: calc(var(--bw) + 1px); stroke-linejoin: round; stroke-linecap: round;
}
.pg-chart__vertex { fill: var(--chart-line); stroke: var(--bg); stroke-width: 1.5; }
.pg-chart__point { fill: var(--chart-line); stroke: var(--bg); stroke-width: 2.5; }
.pg-chart__cursor { stroke: var(--ink-3); stroke-width: 1; shape-rendering: crispEdges; }
.pg-chart__band { fill: var(--fill); }
.pg-chart__bar { fill: var(--chart-line); rx: min(4px, var(--r-s)); }
.pg-chart__bar--quiet { fill: var(--chart-muted); }
.pg-chart__threshold { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; shape-rendering: crispEdges; }

.pg-spark { display: block; overflow: visible; }
.pg-spark__line { fill: none; stroke: var(--chart-muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.pg-spark__end { fill: var(--chart-line); }

/* ---- Muscle balance ---- */
.pg-balance { display: flex; align-items: center; gap: 16px; }
.pg-balance > .gbx { flex: none; --gbx-ground: var(--bg); }
.pg-rank { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pg-rank__row { display: grid; grid-template-columns: 78px minmax(0, 1fr) 34px; align-items: center; gap: 8px; min-height: 18px; }
.pg-rank__row > :last-child { text-align: right; }
.pg-rank__track { display: block; }
.pg-rank__bar { display: block; height: 6px; min-width: 2px; border-radius: var(--r-pill); background: var(--chart-line); }

.pg-callout { display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 1px solid var(--line); }
.pg-callout__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ---- Rows: trailing figure, date block ---- */
.pg-figure { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.pg-date { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 34px; color: var(--ink); }

.pg-week { display: flex; flex-direction: column; gap: 8px; }
.pg-week + .pg-week { margin-top: 10px; }
.pg-week__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-inline: 2px; }

/* ---- Exercise progress page ---- */
.pg-detail { display: flex; flex-direction: column; gap: 16px; }
.pg-readout { display: flex; flex-direction: column; gap: 2px; }
.pg-readout__value { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
.pg-sets { display: flex; flex-wrap: wrap; gap: 0 12px; color: var(--ink-2); }
.pg-sets__group { white-space: nowrap; }

/* 54-exercises.css */
/* Exercises: layout only; tokens for everything visual. */

.ex-find { display: flex; flex-direction: column; gap: 6px; }
.ex-find > :first-child { margin-bottom: 6px; }
.ex-results { display: flex; flex-direction: column; gap: 8px; }
.ex-results__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px; padding-inline: 2px; }

/* ---- Detail ---- */
.ex-intro { display: flex; flex-direction: column; gap: 16px; }
.ex-hero { position: relative; display: grid; place-items: center; padding: 12px 0 8px; overflow: hidden; }
.ex-hero__control { position: absolute; right: 8px; bottom: 8px; }

.ex-muscles { display: flex; align-items: center; gap: 20px; }
